<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with safe zone rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad-bg)"/>
  
  <!-- Outer warm glow circle -->
  <circle cx="256" cy="256" r="190" fill="#FFFDF9" opacity="0.12"/>
  
  <!-- Inner White Plate/Bowl -->
  <g filter="url(#shadow)">
    <!-- Plate base -->
    <ellipse cx="256" cy="310" rx="160" ry="85" fill="#FFFDF9"/>
    <ellipse cx="256" cy="305" rx="145" ry="72" fill="#FEEAD2"/>
    <ellipse cx="256" cy="300" rx="130" ry="60" fill="#FFEDD5"/>
    
    <!-- Food bowl / Karahi -->
    <path d="M150 280 C150 350, 362 350, 362 280 Z" fill="#9A3412"/>
    <ellipse cx="256" cy="280" rx="106" ry="32" fill="#EA580C"/>
    
    <!-- Fresh Steaming Momo / Delicacy -->
    <g fill="#FFFDF9" stroke="#E2E8F0" stroke-width="2">
      <ellipse cx="220" cy="275" rx="28" ry="22"/>
      <ellipse cx="280" cy="272" rx="26" ry="20"/>
      <ellipse cx="250" cy="260" rx="28" ry="22"/>
    </g>
    
    <!-- Spicy red chutney dot in center -->
    <ellipse cx="256" cy="285" rx="18" ry="12" fill="#DC2626"/>
    
    <!-- Coriander / Mint Herb in Dark Green -->
    <path d="M256 245 C240 230, 240 215, 256 210 C272 215, 272 230, 256 245 Z" fill="url(#grad-accent)"/>
    <path d="M256 230 C270 220, 285 228, 280 240 C265 242, 260 236, 256 230 Z" fill="url(#grad-accent)"/>
    <path d="M256 230 C242 220, 227 228, 232 240 C247 242, 252 236, 256 230 Z" fill="url(#grad-accent)"/>
    
    <!-- Aroma Steam lines -->
    <path d="M220 190 Q210 165 225 145" fill="none" stroke="#FFFDF9" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M256 180 Q270 155 256 130" fill="none" stroke="#FFFDF9" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    <path d="M292 190 Q305 165 290 145" fill="none" stroke="#FFFDF9" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>
  
  <!-- AI Sparkle in Corner -->
  <g transform="translate(360, 100)">
    <path d="M30 0 L36 18 L54 24 L36 30 L30 48 L24 30 L6 24 L24 18 Z" fill="#FEF08A"/>
    <circle cx="30" cy="24" r="5" fill="#FFFFFF"/>
  </g>
  <g transform="translate(100, 130) scale(0.65)">
    <path d="M30 0 L36 18 L54 24 L36 30 L30 48 L24 30 L6 24 L24 18 Z" fill="#FEF08A" opacity="0.8"/>
  </g>
</svg>
